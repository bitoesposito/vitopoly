      name="description"

    <meta
      property="og:description"
      content="Da Foggia alla Milano di Mani Pulite: compra, incassa, corrompi e finisci in galera. Per 2-8 amici, in tempo reale. Serve solo un link."
    />

  <body>
    <!--
      THESIS: la plancia è un foglio di carta valori dello Stato, non un Monopoly ri-skinnato;
      rifiuta sia il panno verde Hasbro sia il dark-dashboard-con-un-accento.
      OWN-WORLD: inchiostri d'intaglio (verde-nero, sanguigna, indaco) su fondo carta-vuoto;
      filetti d'incisione al posto dei gap; guilloche solo dove c'è scala; mono da numero di
      serie su ogni cifra; nomi di regione in caps a scala microtesto; lo stato è sovrastampa
      (IPOTECATO, ANNULLATO).
      STORY: il giocatore vede denaro che non dovrebbe stare dove sta, capisce che la partita è
      satira della corruzione italiana, e gioca il suo turno.
      FIRST VIEWPORT: campo-nota 11x11 centrato, talloncini delle proprietà sui bordi, vassoio
      dadi sul pannello guilloche al centro con l'azione primaria subito sotto, roster a destra
      come matrici emesse.
      FORM: carta valori — 3a di 7 direzioni fondate; seed fd32e0d9.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <!-- Zona pollice: la plancia è quadra, quindi su un telefono l'azione primaria finirebbe
         nel terzo alto. Center ci sposta dentro i bottoni sotto md (non li duplica). Fuori da
         React perché esista già al primo render: niente setState dentro un effect. -->
    <div
      id="barra-azione"
      class="fixed inset-x-0 bottom-0 z-30 flex flex-wrap items-center justify-center gap-2 border-t border-border bg-card/95 p-2 pb-[max(0.5rem,env(safe-area-inset-bottom))] backdrop-blur-sm empty:hidden md:hidden"
    ></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
