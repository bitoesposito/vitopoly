# Il nome è quello dello script che serve server.tangentopoly.it dal 4 luglio: un Durable
# Object namespace non si sposta fra script, e lì dentro ci sono le stanze vive. Rinominare
# il worker al posto del file avrebbe abbandonato le partite in corso.
name = "tangentopoly-server"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# Free tier requires the SQLite storage backend for new DO classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Workers Logs: 200k eventi al giorno gratis, 3 giorni di retention.
[observability]
enabled = true

# Le metriche: il dataset nasce alla prima scrittura, non va creato a mano. Piano Free:
# 100k punti al giorno, 3 mesi di retention. Lo schema sta in src/metriche.ts.
# Il dataset non si svuota: azzerare vuol dire cambiargli nome qui.
[[analytics_engine_datasets]]
binding = "METRICHE"
dataset = "gioco"

# Il registro delle partite: una riga per partita e una per partecipante. Analytics Engine
# è approssimativo a bassi volumi (qualche punto perso, minuti di ingestione); qui i numeri
# sono esatti e si possono incrociare. Schema in packages/server/partite.sql.
[[d1_databases]]
binding = "PARTITE"
database_name = "tangentopoly-partite"
database_id = "62279fee-3581-40bd-a174-4115cc7584bf"
