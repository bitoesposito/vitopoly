# Il motivo per cui esiste: `pnpm typecheck` è stato per mesi un tsc che non compilava
# niente, e nessuno se n'è accorto perché niente lo eseguiva.
name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test   # radice: copre motore E client
      - run: pnpm build
