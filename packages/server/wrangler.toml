name = "tangentopoly"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# Free tier requires the SQLite storage backend for new DO classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# I log erano spenti: il loop di una stanza che si giocava da sola è girato un mese senza
# lasciare traccia. 200k eventi al giorno sono gratis, la retention è di 3 giorni.
[observability]
enabled = true
