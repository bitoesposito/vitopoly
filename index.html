<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bollo.svg" />
    <!-- interactive-widget: la tastiera accorcia il viewport invece di scorrere la pagina
         sotto di sé. L'app è alta h-dvh con gli scroller dentro, quindi si rimpagina sopra
         la tastiera e niente si sposta. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#202e29" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Tangentopoly" />
    <title>Tangentopoly | Il gioco della Prima Repubblica</title>
    <meta
      name="description"
      content="Da Foggia alla Milano di Mani Pulite: compra, incassa, corrompi e finisci in galera. Gioco da tavolo online in tempo reale, gratis, per 2-8 amici. Nessun account: serve solo un link."
    />
    <meta property="og:title" content="Tangentopoly — il gioco della Prima Repubblica" />
    <meta
      property="og:description"
      content="Da Foggia alla Milano di Mani Pulite: compra, incassa, corrompi e finisci in galera. Per 2-8 amici, in tempo reale. Serve solo un link."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:image" content="%VITE_SITE_URL%/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tangentopoly — Serie 1992, il gioco della Prima Repubblica" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <div
      id="barra-azione"
      class="fixed inset-x-0 bottom-0 z-30 flex min-h-[calc(4.25rem_+_env(safe-area-inset-bottom))] flex-row-reverse items-center justify-center gap-2 border-t border-border bg-card/95 p-2 pr-15 pb-[max(0.5rem,env(safe-area-inset-bottom))] backdrop-blur-sm empty:hidden md:hidden"
    ></div>
    <script>
      // Web Analytics di Cloudflare: visite, browser e dispositivi di chi APRE l'app, che il
      // server non vede (lui conosce solo chi entra in una stanza). Senza cookie e senza dati
      // personali. Il token sta in .env.production come VITE_RUM_TOKEN: se manca, in sviluppo
      // la variabile resta letterale e il beacon non si carica affatto.
      const rum = "%VITE_RUM_TOKEN%";
      if (rum && !rum.startsWith("%")) {
        const b = document.createElement("script");
        b.defer = true;
        b.src = "https://static.cloudflareinsights.com/beacon.min.js";
        b.setAttribute("data-cf-beacon", JSON.stringify({ token: rum }));
        document.head.appendChild(b);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
